<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Premium Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <!-- Official YouTube Logo without any background wrapper -->
        <svg class="yt-logo" width="34" height="24" viewBox="0 0 34 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M33.3 3.8C32.9 2.3 31.7 1.1 30.2 0.7 27.5 0 17 0 17 0S6.5 0 3.8 0.7C2.3 1.1 1.1 2.3 0.7 3.8 0 6.5 0 12 0 12s0 5.5 0.7 8.2c0.4 1.5 1.6 2.7 3.1 3.1 2.7 0.7 13.2 0.7 13.2 0.7s10.5 0 13.2-0.7c1.5-0.4 2.7-1.6 3.1-3.1 0.7-2.7 0.7-8.2 0.7-8.2s0-5.5-0.7-8.2z" fill="#FF0000"/>
          <polygon points="13.6,17.1 22.4,12 13.6,6.9" fill="#FFFFFF"/>
        </svg>
        <div class="brand-text">
          <h1>YouTube</h1>
          <span class="brand-badge">Premium</span>
        </div>
      </div>
      <div id="domain-badge" class="domain-badge">Active Site</div>
    </header>

    <main class="content">
      <!-- Section 1: Ad Block -->
      <section class="card">
        <div class="card-body">
          <div class="control-row">
            <div class="control-info">
              <span class="control-label">Ad Blocker</span>
              <span class="control-subtext">Block video ads & banners</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="adblock-toggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>

      <!-- Section 2: Picture-in-Picture -->
      <section class="card">
        <div class="card-body">
          <button id="pip-button" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <rect x="11" y="9" width="9" height="6" rx="1" fill="currentColor"/>
            </svg>
            Minimize Screen / Picture-in-Picture
          </button>
        </div>
      </section>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
